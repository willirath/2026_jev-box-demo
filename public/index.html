<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotdog / Not Hotdog</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --yes: #1a7f37; --no: #c62828; --border: #ccc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eee; --muted: #999; --yes: #4caf50; --no: #ef5350; --border: #444; }
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif;
         max-width: 40rem; margin: 0 auto; padding: 1rem; }
  h1 { margin: 0.5rem 0; }
  p.small { color: var(--muted); font-size: 0.85rem; }
  label { display: block; margin-top: 0.75rem; font-weight: 600; }
  input[type=password], input[type=url] { width: 100%; box-sizing: border-box; padding: 0.4rem;
         border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  button { margin-top: 1rem; padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer; }
  #stage { position: relative; display: inline-block; margin-top: 1rem; max-width: 100%; }
  #stage img { display: block; max-width: 100%; }
  #box { position: absolute; border: 3px solid var(--yes); display: none; }
  #verdict { font-size: 2.5rem; font-weight: 800; margin: 1rem 0 0; }
  #verdict.yes { color: var(--yes); }
  #verdict.no { color: var(--no); }
  pre { font-size: 0.75rem; overflow-x: auto; color: var(--muted); }
</style>
</head>
<body>
<h1>🌭 Hotdog / Not Hotdog</h1>
<p class="small">Asks TypeSafe's Jev (via OpenRouter) a <code>noul</code> question ("is this a hot dog?")
and a <code>box</code> question ("where is it?"). Your key is sent only to openrouter.ai.</p>

<label for="key">OpenRouter API key</label>
<input id="key" type="password" placeholder="sk-or-v1-..." autocomplete="off">
<label><input id="remember" type="checkbox"> remember key in this browser</label>

<label for="file">Image file</label>
<input id="file" type="file" accept="image/*">
<label for="url">…or image URL (host must allow CORS)</label>
<input id="url" type="url" placeholder="https://...">

<button id="go">Hotdog?</button>

<div id="verdict"></div>
<div id="stage"><img id="img" alt=""><div id="box"></div></div>
<pre id="raw"></pre>

<script>
const MODEL = "typesafe/jev-1.14";
const MAX_SIDE = 768;
const $ = (id) => document.getElementById(id);

try {
  const k = localStorage.getItem("orKey");
  if (k) { $("key").value = k; $("remember").checked = true; }
} catch (e) {}

// Load the image (file or URL), downscale, and return a JPEG data URI.
async function loadImage() {
  let src;
  if ($("file").files[0]) src = URL.createObjectURL($("file").files[0]);
  else if ($("url").value) src = URL.createObjectURL(await (await fetch($("url").value)).blob());
  else throw new Error("Pick an image file or enter a URL.");
  const img = $("img");
  await new Promise((ok, fail) => { img.onload = ok; img.onerror = () => fail(new Error("Could not load image.")); img.src = src; });
  const s = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * s);
  c.height = Math.round(img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}

async function classify(key, dataUri) {
  const r = await fetch("https://openrouter.ai/api/alpha/decisions", {
    method: "POST",
    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL,
      state: [{ type: "image_url", image_url: { url: dataUri } }],
      questions: {
        hotdog: { type: "noul", instructions: "The image shows a hot dog (a sausage served in a split bun)." },
        where: { type: "box", instructions: "the hot dog" },
      },
    }),
  });
  if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  return r.json();
}

$("go").onclick = async () => {
  const key = $("key").value.trim();
  const v = $("verdict"), box = $("box");
  v.className = ""; box.style.display = "none"; $("raw").textContent = "";
  if (!key) { v.textContent = "Enter an OpenRouter key."; return; }
  try { $("remember").checked ? localStorage.setItem("orKey", key) : localStorage.removeItem("orKey"); } catch (e) {}
  try {
    v.textContent = "…";
    const resp = await classify(key, await loadImage());
    $("raw").textContent = JSON.stringify(resp, null, 2);
    const p = resp.answers.hotdog.noul;
    const yes = p >= 0.5;
    v.className = yes ? "yes" : "no";
    v.textContent = `${yes ? "Hotdog" : "Not hotdog"} (${Math.round(p * 100)}%)`;
    const b = resp.answers.where && resp.answers.where.box;
    if (yes && b) {
      Object.assign(box.style, {
        display: "block",
        left: `${b.left * 100}%`, top: `${b.top * 100}%`,
        width: `${(b.right - b.left) * 100}%`, height: `${(b.bottom - b.top) * 100}%`,
      });
    }
  } catch (e) {
    v.textContent = e.message;
  }
};
</script>
</body>
</html>
